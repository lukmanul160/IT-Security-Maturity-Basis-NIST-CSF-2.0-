<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc"><title id="title">Arsitektur NIST Basis ? Docker HTTPS dengan Nginx</title><desc id="desc">Browser mengakses Nginx pada port 443. Nginx meneruskan HTTP ke aplikasi pada jaringan proxy. Aplikasi mengakses PostgreSQL pada jaringan database. Hanya Nginx mempublikasikan port host. Data dan sertifikat memakai volume persisten.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#70d8e4" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e9f2fa}.title{font-size:20px;font-weight:600}.body{font-size:15px;fill:#c6d5e3}.label{font-size:14px;fill:#82e1e6}.line{stroke:#70d8e4;stroke-width:2;fill:none;marker-end:url(#arrow)}.volume{stroke:#7796af;stroke-width:2;fill:none;stroke-dasharray:6 5}</style><rect width="1320" height="820" fill="#091623"/><text x="40" y="50" font-size="29" font-weight="700">NIST Basis ? Docker HTTPS</text><text x="40" y="80" class="body">Akses IP sekarang. Beralih ke domain melalui konfigurasi yang sama.</text><rect x="335" y="115" width="945" height="555" rx="20" fill="#102438" stroke="#456078"/><text x="360" y="148" class="title">VM / Docker Compose ? it_governance_blackowl</text>
<g><rect x="35" y="225" width="250" height="150" rx="14" fill="#16354d" stroke="#456078"/><text x="55" y="257" class="title">Browser pengguna</text><text x="55" y="285" class="body">https://IP-VM/login</text><text x="55" y="307" class="body">TCP 443: HTTPS</text><text x="55" y="329" class="body">TCP 80: redirect HTTPS</text></g>
<g><rect x="365" y="225" width="250" height="150" rx="14" fill="#154658" stroke="#456078"/><text x="385" y="257" class="title">Nginx</text><text x="385" y="285" class="body">TLS termination</text><text x="385" y="307" class="body">IP: CA internal</text><text x="385" y="329" class="body">Domain: SSL sendiri</text></g>
<g><rect x="685" y="225" width="250" height="150" rx="14" fill="#16354d" stroke="#456078"/><text x="705" y="257" class="title">Aplikasi</text><text x="705" y="285" class="body">Express + Vue hasil build</text><text x="705" y="307" class="body">HTTP app:8000</text><text x="705" y="329" class="body">Cookie Secure ? 1 proxy</text></g>
<g><rect x="1000" y="225" width="250" height="150" rx="14" fill="#16354d" stroke="#456078"/><text x="1020" y="257" class="title">PostgreSQL 17</text><text x="1020" y="285" class="body">db:5432</text><text x="1020" y="307" class="body">Database wajib</text><text x="1020" y="329" class="body">Tanpa port host</text></g>
<path class="line" d="M285 300 H365"/><text x="292" y="286" class="label">HTTPS</text><path class="line" d="M615 300 H685"/><text x="622" y="286" class="label">HTTP</text><path class="line" d="M935 300 H1000"/><text x="942" y="286" class="label">SQL</text>
<text x="425" y="413" class="label">Jaringan proxy: Nginx + app</text><text x="930" y="443" class="label">Jaringan database: app + db</text>
<g><rect x="365" y="495" width="250" height="125" rx="14" fill="#16354d" stroke="#456078"/><text x="385" y="527" class="title">Volume sertifikat</text><text x="385" y="555" class="body">nginx_tls ? CA + key</text><text x="385" y="577" class="body">certs host ? read-only</text><text x="385" y="599" class="body">Backup privat dan aman</text></g>
<g><rect x="685" y="495" width="250" height="125" rx="14" fill="#16354d" stroke="#456078"/><text x="705" y="527" class="title">Volume aplikasi</text><text x="705" y="555" class="body">app_data ? kunci SMTP</text><text x="705" y="577" class="body">uploads ? evidence</text><text x="705" y="599" class="body">backups ? arsip lokal</text></g>
<g><rect x="1000" y="495" width="250" height="125" rx="14" fill="#16354d" stroke="#456078"/><text x="1020" y="527" class="title">Volume database</text><text x="1020" y="555" class="body">postgres_data</text><text x="1020" y="577" class="body">Data + indeks + WAL</text></g>
<path class="volume" d="M490 375 V495"/><path class="volume" d="M810 375 V495"/><path class="volume" d="M1125 375 V495"/>
<g><rect x="35" y="440" width="250" height="180" rx="14" fill="#16354d" stroke="#456078"/><text x="55" y="472" class="title">Trust sertifikat IP</text><text x="55" y="500" class="body">Impor root.crt Nginx</text><text x="55" y="522" class="body">ke setiap perangkat.</text><text x="55" y="544" class="body">Tanpa trust CA, browser</text><text x="55" y="566" class="body">memberi peringatan SSL.</text></g>
<rect x="35" y="700" width="1245" height="85" rx="14" fill="#16354d"/><text x="55" y="730" class="title">IP ke domain: ubah .env.docker</text><text x="55" y="758" class="body">BLACKOWL_ADDRESS: IP ke nist.perusahaan.com    |    Aktifkan cert/key pada template Nginx    |    Recreate Nginx</text></svg>