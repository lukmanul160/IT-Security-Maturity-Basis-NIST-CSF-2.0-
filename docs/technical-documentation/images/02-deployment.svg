<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img"><title>Deployment Docker dan jaringan</title><rect width="100%" height="100%" fill="#f4f7fb"/>
<text x="40" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#102d4c">Deployment Docker dan jaringan</text>
<text x="40" y="88" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#536b83">Konfigurasi Compose aktual; reverse proxy HTTPS adalah rancangan produksi opsional.</text>
<rect x="40" y="155" width="300" height="145" rx="10" fill="white" stroke="#c8d6e5"/><path d="M50,159 H330" stroke="#1c6da1" stroke-width="7"/>
<text x="56" y="191" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1c6da1">Client browser</text>
<text x="56" y="219" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">Jaringan pengguna</text>
<text x="56" y="245" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">HTTP lokal / HTTPS produksi</text>
<rect x="440" y="155" width="340" height="145" rx="10" fill="white" stroke="#c8d6e5"/><path d="M450,159 H770" stroke="#1c6da1" stroke-width="7"/>
<text x="456" y="191" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1c6da1">Host / reverse proxy</text>
<text x="456" y="219" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">Default: 127.0.0.1:5000</text>
<text x="456" y="245" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">Opsional proxy TLS :443</text>
<text x="456" y="271" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">Proxy harus menjaga Host</text>
<rect x="890" y="155" width="420" height="145" rx="10" fill="white" stroke="#c8d6e5"/><path d="M900,159 H1300" stroke="#1c6da1" stroke-width="7"/>
<text x="906" y="191" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1c6da1">Container app</text>
<text x="906" y="219" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">IT_Governance_BLACKOWL</text>
<text x="906" y="245" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">Node 24 / port internal 8000</text>
<text x="906" y="271" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">Runtime non-root: node</text>
<polyline points="340,227 440,227" fill="none" stroke="#5d7d9b" stroke-width="2"/><polygon points="440,227 428.94726807196537,231.6730201077038 428.94726807196537,222.3269798922962" fill="#5d7d9b"/>
<text x="347" y="205" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#536b83">HTTP(S)</text>
<polyline points="780,227 890,227" fill="none" stroke="#5d7d9b" stroke-width="2"/><polygon points="890,227 878.9472680719654,231.6730201077038 878.9472680719654,222.3269798922962" fill="#5d7d9b"/>
<text x="783" y="205" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#536b83">5000 -&gt; 8000</text>
<rect x="890" y="415" width="420" height="160" rx="10" fill="white" stroke="#c8d6e5"/><path d="M900,419 H1300" stroke="#1c6da1" stroke-width="7"/>
<text x="906" y="451" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1c6da1">Container database</text>
<text x="906" y="479" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">BlackOwl_DB_Gov</text>
<text x="906" y="505" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">postgres:17-bookworm / 5432</text>
<text x="906" y="531" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">Internal network; port tidak dipublikasi</text>
<polyline points="1100,300 1100,415" fill="none" stroke="#5d7d9b" stroke-width="2"/><polygon points="1100,415 1095.326979892296,403.94726807196537 1104.673020107704,403.94726807196537" fill="#5d7d9b"/>
<text x="1115" y="354" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#536b83">SQL internal</text>
<rect x="40" y="415" width="690" height="165" rx="10" fill="white" stroke="#c8d6e5"/><path d="M50,419 H720" stroke="#1c6da1" stroke-width="7"/>
<text x="56" y="451" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1c6da1">Named volumes persisten</text>
<text x="56" y="479" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">postgres_data -&gt; /var/lib/postgresql/data</text>
<text x="56" y="505" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">app_data -&gt; /app/data; uploads -&gt; /app/upload</text>
<text x="56" y="531" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">backups -&gt; /app/backup; down -v menghapus volume</text>
<polyline points="890,488 730,488" fill="none" stroke="#5d7d9b" stroke-width="2"/><polygon points="730,488 741.0527319280346,483.3269798922962 741.0527319280346,492.6730201077038" fill="#5d7d9b"/>
<text x="742" y="468" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#536b83">persistensi</text>
<rect x="40" y="660" width="570" height="90" rx="10" fill="white" stroke="#c8d6e5"/><path d="M50,664 H600" stroke="#1c6da1" stroke-width="7"/>
<text x="56" y="696" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1c6da1">Eksternal opsional</text>
<text x="56" y="724" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">SMTP / NAS / S3 / GCS sesuai konfigurasi</text>
<rect x="745" y="660" width="565" height="90" rx="10" fill="white" stroke="#c8d6e5"/><path d="M755,664 H1300" stroke="#1c6da1" stroke-width="7"/>
<text x="761" y="696" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1c6da1">Healthcheck</text>
<text x="761" y="724" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#243f61">App: GET /login; DB: pg_isready</text>
<text x="40" y="828" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#617b93">NIST Basis / BLACKOWL | Source workspace | 09-10-2026 | Tidak memuat data atau kredensial produksi</text>
