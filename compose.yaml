name: it_governance_blackowl

services:
  app:
    build: .
    image: it_governance_blackowl:local
    container_name: IT_Governance_BLACKOWL
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: BlackOwl_DB_Gov
      DB_USER: blackowl
      DB_PASSWORD: ${BLACKOWL_DB_PASSWORD:?Set BLACKOWL_DB_PASSWORD in .env.docker}
      DB_SSL: "false"
      # HTTP on loopback by default. Use true when serving through HTTPS.
      SESSION_COOKIE_SECURE: ${BLACKOWL_COOKIE_SECURE:-false}
      TZ: Asia/Bangkok
    ports:
      - "${BLACKOWL_BIND_IP:-127.0.0.1}:${BLACKOWL_PORT:-5000}:8000"
    volumes:
      - app_data:/app/data
      - uploads:/app/upload
      - backups:/app/backup
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s

  db:
    # Internal Docker only: do not publish PostgreSQL's port to the host.
    image: postgres:17-bookworm
    container_name: BlackOwl_DB_Gov
    restart: unless-stopped
    environment:
      POSTGRES_DB: BlackOwl_DB_Gov
      POSTGRES_USER: blackowl
      POSTGRES_PASSWORD: ${BLACKOWL_DB_PASSWORD:?Set BLACKOWL_DB_PASSWORD in .env.docker}
      TZ: Asia/Bangkok
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  # Persistent named volumes: reused by up --build and preserved by down.
  # Keep the project name above unchanged; down -v deletes these volumes.
  postgres_data:
  app_data:
  uploads:
  backups:
