name: it_governance_blackowl

services:
  nginx:
    build: ./deploy/nginx
    image: it_governance_blackowl_nginx:local
    restart: unless-stopped
    environment:
      BLACKOWL_ADDRESS: ${BLACKOWL_ADDRESS:?Set BLACKOWL_ADDRESS to the VM IP or domain}
      NGINX_ENVSUBST_FILTER: "^BLACKOWL_ADDRESS$$"
    ports:
      - "${BLACKOWL_BIND_IP:-0.0.0.0}:80:80"
      - "${BLACKOWL_BIND_IP:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - nginx_tls:/etc/nginx/generated
    networks:
      - proxy
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    image: it_governance_blackowl:local
    container_name: IT_Governance_BLACKOWL
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: BlackOwl_DB_Gov
      DB_USER: blackowl
      DB_PASSWORD: ${BLACKOWL_DB_PASSWORD:?Set BLACKOWL_DB_PASSWORD in .env.docker}
      DB_SSL: "false"
      # HTTPS terminates at Nginx; no direct backend port is published.
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "1"
      REDIS_CACHE_ENABLED: "true"
      TZ: Asia/Bangkok
    networks:
      - proxy
      - database
      - cache
    volumes:
      - app_data:/app/data
      - uploads:/app/upload
      - backups:/app/backup
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Disposable cache only, with no host port or persistent volume.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 192m
    networks:
      - cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    # Internal Docker only: do not publish PostgreSQL's port to the host.
    image: postgres:17-bookworm
    container_name: BlackOwl_DB_Gov
    restart: unless-stopped
    networks:
      - database
    environment:
      POSTGRES_DB: BlackOwl_DB_Gov
      POSTGRES_USER: blackowl
      POSTGRES_PASSWORD: ${BLACKOWL_DB_PASSWORD:?Set BLACKOWL_DB_PASSWORD in .env.docker}
      TZ: Asia/Bangkok
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  # Persistent named volumes: reused by up --build and preserved by down.
  # Keep the project name above unchanged; down -v deletes these volumes.
  postgres_data:
  app_data:
  uploads:
  backups:
  nginx_tls:

networks:
  proxy:
  database:
  cache:
    internal: true
