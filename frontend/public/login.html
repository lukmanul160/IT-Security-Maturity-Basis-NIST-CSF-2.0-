<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | NIST Basis</title>
  <!-- Critical login styles must work before authentication, even when the
       running server cannot yet serve the shared Tailwind stylesheet. -->
  <style>
    .login-page, .login-page * { box-sizing: border-box; }
    body.login-page { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top left, #dbeafe80, transparent 50%), #f5f7fb; color: #1e293b; font: 14px/1.5 "Segoe UI", ui-sans-serif, system-ui, sans-serif; }
    .login-page .login-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: 100%; max-width: 960px; overflow: hidden; border: 1px solid #e2e8f0; border-radius: 24px; background: #fff; box-shadow: 0 24px 80px #0f172a0a; }
    .login-page .login-story { display: flex; flex-direction: column; justify-content: space-between; gap: 40px; min-width: 0; min-height: 560px; padding: 48px; background: #0f172a; color: #fff; }
    .login-page .brand-block { display: flex; align-items: center; gap: 12px; }
    .login-page .brand-mark { display: grid; place-items: center; flex: 0 0 40px; width: 40px; height: 40px; border-radius: 12px; background: #2563eb; color: #fff; }
    .login-page .brand-mark svg { display: block; width: 23px; height: 23px; }
    .login-page .brand-title { color: #fff; font-size: 16px; font-weight: 700; letter-spacing: -.025em; }
    .login-page .login-story h2 { margin: 0 0 20px; font-size: 36px; font-weight: 600; line-height: 1.25; letter-spacing: -.025em; }
    .login-page .login-story p { margin: 0; color: #94a3b8; font-size: 14px; line-height: 2; }
    .login-page .login-story .eyebrow { margin-bottom: 16px; color: #93c5fd; font-size: 10px; font-weight: 600; letter-spacing: .1em; }
    .login-page .login-story-footer { color: #94a3b8; font-size: 12px; }
    .login-page .login-form-panel { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 48px; }
    .login-page .login-form-panel h1 { margin: 0 0 8px; color: #0f172a; font-size: 30px; font-weight: 700; line-height: 1.2; letter-spacing: -.025em; }
    .login-page .login-form-panel p { margin: 0 0 28px; color: #64748b; line-height: 1.7; }
    .login-page .field { display: grid; gap: 8px; margin-bottom: 20px; }
    .login-page label { color: #334155; font-size: 12px; font-weight: 600; }
    .login-page input { display: block; width: 100%; min-width: 0; min-height: 46px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; color: #334155; font: inherit; }
    .login-page input::placeholder { color: #94a3b8; opacity: 1; }
    .login-page .button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 46px; padding: 12px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: 600 13px/1.5 "Segoe UI", ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
    .login-page .button:hover { background: #1d4ed8; }
    .login-page :is(input, button):focus-visible { outline: 3px solid #60a5fa; outline-offset: 3px; }
    .login-page .login-error { min-height: 20px; margin-bottom: 16px; color: #dc2626; font-size: 12px; overflow-wrap: anywhere; }
    @media (max-width: 700px) {
      body.login-page { padding: 16px; }
      .login-page .login-layout { grid-template-columns: minmax(0, 1fr); max-width: 440px; }
      .login-page .login-story { min-height: 0; gap: 24px; padding: 28px; }
      .login-page .login-story h2 { margin-bottom: 8px; font-size: 24px; }
      .login-page .login-story p { font-size: 12px; }
      .login-page .login-story :is(.eyebrow, .login-story-footer) { display: none; }
      .login-page .login-form-panel { padding: 28px; }
    }
  </style>
  <link rel="stylesheet" href="/tailwind.css">
</head>
<body class="workspace-ui login-page">
  <main class="login-layout">
    <section class="login-story" aria-label="NIST Basis workspace">
      <div class="brand-block"><div class="brand-mark"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6l-8-3Z"/><path d="m8 12 3 3 5-6"/></svg></div><strong class="brand-title">NIST Basis</strong></div>
      <div><p class="eyebrow">IT GOVERNANCE WORKSPACE</p><h2>Clarity for your<br>security journey.</h2><p>Assessment, pengelolaan risiko, dan evidence dalam satu workspace yang terorganisir.</p></div>
      <span class="login-story-footer">NIST CSF &middot; Privacy Framework &middot; ISO 27001</span>
    </section>
    <section class="login-form-panel" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Welcome back</h1>
      <p>Masuk untuk melanjutkan assessment Anda.</p>
      <form id="loginForm">
        <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" placeholder="Masukkan username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required></div>
        <div class="login-error" id="loginError" role="alert" aria-live="polite"></div>
        <button class="button button-accent" type="submit">Masuk ke workspace <span aria-hidden="true">&rarr;</span></button>
      </form>
    </section>
  </main>
  <script>
    const redirectToFrameworkChooser = () => { localStorage.removeItem('nist-maturity-ui'); window.location.replace('/'); };
    fetch('/api/auth/me', { cache: 'no-store' }).then(response => { if (response.ok) redirectToFrameworkChooser(); });
    window.addEventListener('pageshow', () => { fetch('/api/auth/me', { cache: 'no-store' }).then(response => { if (response.ok) redirectToFrameworkChooser(); }); });
    loginForm.addEventListener('submit', async event => { event.preventDefault(); loginError.textContent = ''; const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username.value, password: password.value }) }); if (response.ok) redirectToFrameworkChooser(); else loginError.textContent = (await response.json()).error || 'Login gagal'; });
  </script>
</body>
</html>
