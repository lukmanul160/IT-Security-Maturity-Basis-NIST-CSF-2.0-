name: Docker smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: nist-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: /tmp/nist-smoke.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare isolated Compose configuration without deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          export BLACKOWL_DB_PASSWORD="$(openssl rand -hex 24)"
          export BLACKOWL_ADDRESS=127.0.0.1
          # Explicit empty env file prevents reading a deployment .env.
          docker compose --env-file /dev/null -f compose.yaml config --format json > /tmp/nist-smoke-source.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/nist-smoke-source.json') as source:
              config = json.load(source)
          config['name'] = os.environ['COMPOSE_PROJECT_NAME']
          for service in config['services'].values():
              service.pop('container_name', None)
              service['restart'] = 'no'
          config['services']['nginx']['ports'] = [
              {'target': 80, 'published': '18080', 'host_ip': '127.0.0.1', 'protocol': 'tcp'},
              {'target': 443, 'published': '18443', 'host_ip': '127.0.0.1', 'protocol': 'tcp'}]
          # Normalized volumes have explicit names; isolate these as well.
          for key, volume in config['volumes'].items():
              volume['name'] = os.environ['COMPOSE_PROJECT_NAME'] + '_' + key
          for key, network in config.get('networks', {}).items():
              network['name'] = os.environ['COMPOSE_PROJECT_NAME'] + '_' + key
          with open(os.environ['COMPOSE_FILE'], 'w') as target:
              json.dump(config, target)
          PY
          rm /tmp/nist-smoke-source.json
          docker compose --env-file /dev/null config --quiet
      - name: Build and start the actual application, PostgreSQL and Nginx
        run: |
          docker compose --env-file /dev/null build --pull app nginx
          docker compose --env-file /dev/null up -d --wait --wait-timeout 300
      - name: Verify HTTPS, database connection, frontend and persistent storage
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T nginx nginx -t
          docker compose cp nginx:/etc/nginx/generated/root.crt /tmp/nist-smoke-ca.crt
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 --cacert /tmp/nist-smoke-ca.crt https://127.0.0.1:18443/login -o /tmp/nist-smoke-login.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/login)" = 308
          docker compose exec -T app node -e "const fs=require('node:fs'); if(!fs.readdirSync('frontend/public/vue/assets').some(f=>f.endsWith('.js'))) process.exit(1); fs.writeFileSync('data/docker-smoke-marker','persistent'); const {pool}=require('./src/config/database'); pool.query('SELECT COUNT(*) FROM app_users').then(r=>{if(Number(r.rows[0].count)<1) throw Error('No seeded account')}).catch(e=>{console.error(e);process.exitCode=1}).finally(()=>pool.end())"
          docker compose exec -T app pg_dump --version
          docker compose exec -T app pg_restore --version
          docker compose up -d --force-recreate --wait --wait-timeout 300 app
          docker compose exec -T app node -e "if(require('node:fs').readFileSync('data/docker-smoke-marker','utf8')!=='persistent') process.exit(1)"
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 --cacert /tmp/nist-smoke-ca.crt https://127.0.0.1:18443/login -o /dev/null
      - name: Verify disposable Redis cache and fallback during outage
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T redis redis-cli ping
          docker compose exec -T app node scripts/test-docker-redis.cjs
          docker compose stop redis
          docker compose exec -T app node -e "const assert=require('node:assert/strict'); const cache=require('./src/services/redisCacheService'); (async()=>{assert.equal(await cache.get('dashboard','outage-fixture'),null);await cache.set('dashboard','outage-fixture',{});cache.close()})().catch(()=>process.exitCode=1)"
          curl --fail --cacert /tmp/nist-smoke-ca.crt https://127.0.0.1:18443/login -o /dev/null
          docker compose start redis
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Remove only this run's temporary containers and volumes
        if: always()
        run: |
          if test -f "$COMPOSE_FILE"; then
            docker compose down --volumes --remove-orphans
            rm "$COMPOSE_FILE"
          fi
